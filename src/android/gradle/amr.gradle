repositories {
    google()
    jcenter()
    maven { url 'https://mvn-repo.admost.com/artifactory/amr-2' }
    maven { url 'https://artifact.bytedance.com/repository/pangle' }
    maven { url 'https://android-sdk.is.com/' }
    maven { url 'https://jitpack.io' }
}

dependencies{

    // Base (Required)
    implementation 'com.admost.sdk:cordova-plugin:1.2.9'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.admost.sdk:amr:3.2.4'

    implementation 'com.google.android.gms:play-services-base:18.6.0'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'

    // Adapters
    implementation 'com.admost.sdk:admost-adapter:1.1.9.a49'
    implementation 'com.admost.sdk:adserver-adapter:1.2.1.a49'
    implementation 'com.admost.sdk:admob-adapter:24.0.0.1.a49'
    implementation 'com.admost.sdk:applovin-adapter:13.5.0.a49'
    implementation 'com.admost.sdk:facebook-adapter:6.20.0.1.a49'
    implementation 'com.admost.sdk:tiktok-adapter:7.6.0.4.a49'
    implementation 'com.admost.sdk:unity-adapter:4.16.1.a49'
    implementation 'com.admost.sdk:vungle-adapter:7.6.0.a49'

    // Dependencies
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-tasks:18.0.1'
    implementation 'com.google.android.gms:play-services-appset:16.0.2'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.annotation:annotation:1.2.0'

    //implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.4.32' 
    //implementation 'androidx.legacy:legacy-support-v4:1.0.0' 
    //implementation 'androidx.recyclerview:recyclerview:1.0.0' 
    //implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.5.10' 
    //implementation 'org.greenrobot:eventbus:3.0.0'     
}

android {
    defaultConfig {
        multiDexEnabled true
    }
  packagingOptions {
    exclude 'META-INF/NOTICE'
    exclude 'META-INF/LICENSE'
    exclude 'assets/*.png'
    exclude 'values/*.xml'
  }
}
